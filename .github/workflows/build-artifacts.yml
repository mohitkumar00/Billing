name: Build BillMate APK & Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore BillMate.sln --configfile nuget.config

      - name: Run Domain, Application & ClientCore Tests
        shell: pwsh
        run: |
          dotnet test tests/BillMate.Domain.Tests/BillMate.Domain.Tests.csproj --configuration Release --no-restore
          dotnet test tests/BillMate.Application.Tests/BillMate.Application.Tests.csproj --configuration Release --no-restore
          dotnet test tests/BillMate.ClientCore.Tests/BillMate.ClientCore.Tests.csproj --configuration Release --no-restore

  build-windows:
    name: Build Windows Desktop App & Setup EXE
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore BillMate.sln --configfile nuget.config

      - name: Build Windows Desktop App
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop | Out-Null
          dotnet publish src/BillMate.App/BillMate.App.csproj `
            -c Release `
            -p:WindowsPackageType=None `
            -o artifacts/desktop

      - name: Build ASP.NET Core Windows Service API
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/api | Out-Null
          dotnet publish src/BillMate.Api/BillMate.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o artifacts/api

      - name: Ensure Inno Setup Compiler
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compile Inno Setup Windows Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/installer | Out-Null
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($iscc) {
            Write-Host "Found Inno Setup at: $iscc"
            & $iscc `
              "/DAppName=BillMate Billing" `
              "/DAppSlug=BillMate_Billing" `
              "/DApiStageDir=$((Resolve-Path artifacts/api).Path)" `
              "/DDesktopStageDir=$((Resolve-Path artifacts/desktop).Path)" `
              "/DOutputDir=$((Resolve-Path artifacts/installer).Path)" `
              installer/BillMate.Setup/BillMate.iss
          } else {
            Write-Warning "Inno Setup compiler not found on runner."
          }

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: BillMate-Windows-Setup-EXE
          path: artifacts/installer/*.exe
          if-no-files-found: warn

      - name: Upload Portable Windows Desktop App
        uses: actions/upload-artifact@v4
        with:
          name: BillMate-Windows-Desktop-Portable
          path: artifacts/desktop/
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    needs: test
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install .NET MAUI Android Workload
        shell: pwsh
        run: |
          dotnet workload install maui-android `
            --skip-manifest-update `
            --source https://api.nuget.org/v3/index.json `
            --ignore-failed-sources

      - name: Accept Android SDK Licenses
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sdkmanager) {
            Write-Host "Accepting licenses using: $sdkmanager"
            echo "y" | & $sdkmanager --licenses
          } else {
            Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/android | Out-Null
          $androidSdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { "C:\Android\android-sdk" }
          Write-Host "Using Android SDK at: $androidSdk"
          Write-Host "Using Java SDK at: $env:JAVA_HOME"

          dotnet restore src/BillMate.App/BillMate.App.csproj `
            -p:EnableAndroidTarget=true `
            --configfile nuget.config

          dotnet publish src/BillMate.App/BillMate.App.csproj `
            -c Release `
            -p:EnableAndroidTarget=true `
            -p:AndroidSdkDirectory="$androidSdk" `
            -p:JavaSdkDirectory="$env:JAVA_HOME" `
            -p:AcceptAndroidSDKLicenses=true `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=false `
            -p:ApplicationTitle="BillMate POS" `
            -p:ApplicationId=com.billmate.pos `
            -o artifacts/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BillMate-Android-APK
          path: artifacts/android/*.apk
          if-no-files-found: warn
